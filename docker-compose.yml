# Local databases: `docker compose up -d postgres` (default driver)
# or `docker compose --profile mysql up -d mysql` when using the MySQL dialect.
# Ports are configurable in case they are taken: POSTGRES_PORT=5433 docker compose up -d postgres
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.4
    profiles: [mysql]
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: app
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pmysql"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Production-like stack:
  #   BETTER_AUTH_SECRET=$(openssl rand -base64 32) docker compose --profile app up -d
  # `migrate` runs once and must succeed before `api` starts, so `api` can be scaled safely.
  migrate:
    profiles: [app]
    build: .
    command: ["bun", "run", "src/db/migrate.ts", "--create-db"]
    environment: &api-env
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/app
      # No fallback on purpose: the app refuses to start without a real secret.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      APP_URL: ${APP_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: [app]
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  mysql_data:
