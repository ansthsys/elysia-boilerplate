# Local databases: `docker compose up -d postgres` (default driver)
# or `docker compose --profile mysql up -d mysql` when using the MySQL dialect.
# Ports are configurable in case they are taken: POSTGRES_PORT=5433 docker compose up -d postgres
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.4
    profiles: [mysql]
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: app
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pmysql"]
      interval: 5s
      timeout: 5s
      retries: 20

  # S3-compatible storage for local development: docker compose --profile s3 up -d
  # Then run the API with STORAGE_DRIVER=s3 and the S3_* variables from .env.example.
  minio:
    image: quay.io/minio/minio:latest
    profiles: [s3]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: quay.io/minio/mc:latest
    profiles: [s3]
    depends_on: [minio]
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done
        mc mb --ignore-existing local/uploads
        mc anonymous set none local/uploads

  # Production-like stack:
  #   BETTER_AUTH_SECRET=$(openssl rand -base64 32) docker compose --profile app up -d
  # `migrate` runs once and must succeed before `api` starts, so `api` can be scaled safely.
  migrate:
    profiles: [app]
    build: .
    command: ["bun", "run", "src/db/migrate.ts", "--create-db"]
    environment: &api-env
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/app
      # No fallback on purpose: the app refuses to start without a real secret.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      APP_URL: ${APP_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_PATH: /app/storage
      STORAGE_PUBLIC_BASE_URL: ${APP_URL:-http://localhost:3000}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: [app]
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment: *api-env
    volumes:
      # Local storage must be a volume: the container filesystem is disposable.
      - storage:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  mysql_data:
  minio_data:
  storage:
